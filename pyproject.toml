[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rating-curve-automater"
version = "0.2.0"
description = "Build a stage-discharge rating curve from messy field-gauging spreadsheets: clean, validate, fit (weighted / piecewise), bootstrap uncertainty bands, rating table, and temporal-drift diagnostics."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Boris Sapojnikov" }]
license = { file = "LICENSE" }
keywords = ["hydrology", "rating curve", "stage discharge", "streamflow", "hydrometry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Hydrology",
]

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "openpyxl>=3.1",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/ZergFromZ0rg/Rating-Curve-Automater"
Repository = "https://github.com/ZergFromZ0rg/Rating-Curve-Automater"
Issues = "https://github.com/ZergFromZ0rg/Rating-Curve-Automater/issues"

[project.optional-dependencies]
app = ["streamlit>=1.49"]   # width="stretch" API (use_container_width deprecated)
# Bayesian backend (thodson-usgs ratingcurve). ratingcurve 1.1 needs
# pymc >= 5.28.1; PyMC stays capped < 6 as a forward guard (ratingcurve does not
# yet declare PyMC 6 support). Tested against ratingcurve 1.1.0 / pymc 5.28.
bayesian = ["ratingcurve>=1.1", "pymc>=5.28,<6"]
dev = ["pytest>=8.0"]

[project.scripts]
rca = "rating_curve_automater.cli:main"

[tool.setuptools]
packages = ["rating_curve_automater"]

[tool.setuptools.package-data]
rating_curve_automater = ["data/*.xlsx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
